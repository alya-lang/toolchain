name: Build & Release Multi-Platform Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Toolchain release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  schedule:
    # Run every Monday at 04:00 UTC to verify upstream updates
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows Minimal Toolchain
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') { $Matches[1] } else { "${{ github.event.inputs.version || '1.0.0' }}" }
          ./scripts/package.ps1 -Version $ver

      - name: Verify Windows Toolchain
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -ToolchainPath dist/alya-toolchain-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: alya-toolchain-windows-x64
          path: dist/alya-toolchain-windows-x64.zip

  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows ARM64 Toolchain
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') { $Matches[1] } else { "${{ github.event.inputs.version || '1.0.0' }}" }
          ./scripts/package.ps1 -Version $ver -Arch arm64

      - name: Verify Windows ARM64 Toolchain
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -ToolchainPath dist/alya-toolchain-windows-arm64.zip -Arch arm64

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: alya-toolchain-windows-arm64
          path: dist/alya-toolchain-windows-arm64.zip

  build-windows-x86:
    name: Windows x86
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows x86 Toolchain
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') { $Matches[1] } else { "${{ github.event.inputs.version || '1.0.0' }}" }
          ./scripts/package.ps1 -Version $ver -Arch x86

      - name: Verify Windows x86 Toolchain
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -ToolchainPath dist/alya-toolchain-windows-x86.zip -Arch x86

      - name: Upload Windows x86 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: alya-toolchain-windows-x86
          path: dist/alya-toolchain-windows-x86.zip

  build-linux:
    name: Linux (x64 & ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux x64 Toolchain
        run: |
          chmod +x scripts/package-linux.sh
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-linux.sh x86_64 "$RELEASE_VER"

      - name: Verify Linux x64 Toolchain
        run: |
          mkdir -p temp_verify_x64
          tar -xzf dist/alya-toolchain-linux-x64.tar.gz -C temp_verify_x64
          ./temp_verify_x64/bin/gcc --version
          echo 'int main() { return 0; }' > test.c
          ./temp_verify_x64/bin/gcc -static test.c -o test_bin
          ./test_bin
          rm -rf test.c test_bin temp_verify_x64

      - name: Build Linux ARM64 Toolchain
        run: |
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-linux.sh aarch64 "$RELEASE_VER"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alya-toolchain-linux
          path: |
            dist/alya-toolchain-linux-x64.tar.gz
            dist/alya-toolchain-linux-arm64.tar.gz

  verify-linux-arm64:
    name: Verify Linux ARM64 (native)
    needs: [build-linux]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: alya-toolchain-linux
          path: artifacts

      - name: Verify Linux ARM64 Toolchain
        run: |
          mkdir -p toolchain
          tar -xzf artifacts/alya-toolchain-linux-arm64.tar.gz -C toolchain
          ./toolchain/bin/gcc --version
          echo 'int main() { return 0; }' > test.c
          ./toolchain/bin/gcc -static test.c -o test_bin
          ./test_bin
          cat > test_asm.s <<'EOF'
              .text
              .globl main
              .type main, %function
          main:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              adrp x0, msg
              add x0, x0, :lo12:msg
              bl puts
              mov w0, #0
              ldp x29, x30, [sp], #16
              ret

              .data
          msg:
              .string "SUCCESS: Alya Linux ARM64 Assembly"
          EOF
          ./toolchain/bin/gcc -static test_asm.s -o test_asm
          ./test_asm | grep -q "SUCCESS"
          rm -rf test.c test_bin test_asm.s test_asm toolchain artifacts

  build-macos:
    name: macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS ARM64 Toolchain
        run: |
          chmod +x scripts/package-macos.sh
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-macos.sh arm64 "$RELEASE_VER"

      - name: Verify macOS ARM64 Toolchain
        run: |
          mkdir -p temp_verify_arm64
          tar -xzf dist/alya-toolchain-macos-arm64.tar.gz -C temp_verify_arm64
          ./temp_verify_arm64/bin/clang --version
          export SDKROOT=$(xcrun --show-sdk-path)
          echo 'int main() { return 0; }' > test.c
          ./temp_verify_arm64/bin/clang test.c -o test_bin
          ./test_bin
          cat > test_asm.s <<'EOF'
              .text
              .globl _main
              .p2align 2
          _main:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              adrp x0, msg@PAGE
              add x0, x0, msg@PAGEOFF
              bl _puts
              mov w0, #0
              ldp x29, x30, [sp], #16
              ret

              .data
          msg:
              .asciz "SUCCESS: Alya macOS ARM64 Assembly"
          EOF
          ./temp_verify_arm64/bin/clang test_asm.s -o test_asm
          ./test_asm | grep -q "SUCCESS"
          rm -rf test.c test_bin test_asm.s test_asm temp_verify_arm64

      - name: Build macOS x64 Toolchain
        run: |
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-macos.sh x64 "$RELEASE_VER"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: alya-toolchain-macos
          path: |
            dist/alya-toolchain-macos-arm64.tar.gz
            dist/alya-toolchain-macos-x64.tar.gz

  verify-macos-x64:
    name: Verify macOS Intel (native)
    needs: [build-macos]
    runs-on: macos-15-intel
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: alya-toolchain-macos
          path: artifacts

      - name: Verify macOS x64 Toolchain
        run: |
          mkdir -p toolchain
          tar -xzf artifacts/alya-toolchain-macos-x64.tar.gz -C toolchain
          ./toolchain/bin/clang --version
          export SDKROOT=$(xcrun --show-sdk-path)
          echo 'int main() { return 0; }' > test.c
          ./toolchain/bin/clang test.c -o test_bin
          ./test_bin
          cat > test_asm.s <<'EOF'
              .text
              .globl _main
          _main:
              pushq %rbp
              movq %rsp, %rbp
              leaq msg(%rip), %rdi
              callq _puts
              xorl %eax, %eax
              popq %rbp
              ret

              .data
          msg:
              .asciz "SUCCESS: Alya macOS x64 Assembly"
          EOF
          ./toolchain/bin/clang test_asm.s -o test_asm
          ./test_asm | grep -q "SUCCESS"
          rm -rf test.c test_bin test_asm.s test_asm toolchain artifacts

  release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-windows-arm64, build-windows-x86, build-linux, verify-linux-arm64, build-macos, verify-macos-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory and Generate Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Update toolchain.json Manifest with Exact Hashes
        run: |
          python3 <<'PYEOF'
          import json, hashlib, os

          with open('toolchain.json', 'r') as f:
              manifest = json.load(f)

          tag_or_input = '${{ github.event.inputs.version || github.ref_name }}'
          if tag_or_input.startswith('v'):
              ver = tag_or_input[1:]
          elif tag_or_input in ('main', 'master'):
              ver = '${{ github.event.inputs.version }}' or '1.0.0'
          else:
              ver = tag_or_input or '1.0.0'
          ver = ver.lstrip('v')
          manifest['version'] = ver

          file_map = {
              'x86_64-pc-windows-gnu': 'alya-toolchain-windows-x64.zip',
              'aarch64-pc-windows-gnu': 'alya-toolchain-windows-arm64.zip',
              'i686-pc-windows-gnu': 'alya-toolchain-windows-x86.zip',
              'x86_64-unknown-linux-musl': 'alya-toolchain-linux-x64.tar.gz',
              'aarch64-unknown-linux-musl': 'alya-toolchain-linux-arm64.tar.gz',
              'aarch64-apple-darwin': 'alya-toolchain-macos-arm64.tar.gz',
              'x86_64-apple-darwin': 'alya-toolchain-macos-x64.tar.gz'
          }

          for platform, filename in file_map.items():
              filepath = os.path.join('dist', filename)
              if os.path.exists(filepath):
                  with open(filepath, 'rb') as af:
                      sha = hashlib.sha256(af.read()).hexdigest()
                  size_mb = round(os.path.getsize(filepath) / (1024 * 1024))
                  if platform in manifest['platforms']:
                      manifest['platforms'][platform]['archive']['sha256'] = sha
                      manifest['platforms'][platform]['archive']['compressed_size_mb'] = size_mb
                      manifest['platforms'][platform]['archive']['url'] = f'https://github.com/alya-lang/toolchain/releases/download/v{ver}/{filename}'

          with open('toolchain.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          # Generate structured release notes with exact table of assets
          platform_labels = {
              'x86_64-pc-windows-gnu': ('**Windows**', 'x86_64 (x64)', '`x86_64-pc-windows-gnu`'),
              'aarch64-pc-windows-gnu': ('**Windows**', 'AArch64 (ARM64)', '`aarch64-pc-windows-gnu`'),
              'i686-pc-windows-gnu': ('**Windows**', 'x86 (32-bit)', '`i686-pc-windows-gnu`'),
              'x86_64-unknown-linux-musl': ('**Linux**', 'x86_64 (x64)', '`x86_64-unknown-linux-musl`'),
              'aarch64-unknown-linux-musl': ('**Linux**', 'AArch64 (ARM64)', '`aarch64-unknown-linux-musl`'),
              'aarch64-apple-darwin': ('**macOS**', 'Apple Silicon (ARM64)', '`aarch64-apple-darwin`'),
              'x86_64-apple-darwin': ('**macOS**', 'Intel (x64)', '`x86_64-apple-darwin`'),
          }

          notes = f"## Alya Minimal Toolchain Suite v{ver}\n\n"
          notes += "Minimal, zero-setup, multi-platform C compiler and GNU Assembler distribution suite for the [Alya Programming Language](https://github.com/alya-lang/alya).\n\n"
          notes += "### 📦 Release Assets & Platform Targets\n\n"
          notes += "| Platform | Architecture | Target Triple | Archive | Size |\n"
          notes += "| :--- | :--- | :--- | :--- | :---: |\n"

          for platform, (os_name, arch_name, triple) in platform_labels.items():
              if platform in manifest['platforms']:
                  p = manifest['platforms'][platform]['archive']
                  fname = p['filename']
                  size = p.get('compressed_size_mb', '-')
                  notes += f"| {os_name} | {arch_name} | {triple} | `{fname}` | {size} MB |\n"

          notes += "\n### 🚀 Key Features\n\n"
          notes += "- **Windows x64**: Curated ultra-lightweight MinGW-w64 distribution with `gcc.exe`, `as.exe`, `ld.exe`, `ar.exe`, `strip.exe`, `objdump.exe`, standard C headers, and Win32 import libraries (`kernel32`, `ws2_32`, `msvcrt`, `user32`, `shell32`, `advapi32`).\n"
          notes += "- **Windows ARM64**: LLVM-MinGW distribution for Windows on ARM64 with `gcc`/`clang` drivers, `as`, `ar`, `windres`, LLD linker, UCRT headers, and ARM64 import libraries (`kernel32`, `ws2_32`, `msvcrt`, ...).\n"
          notes += "- **Windows x86**: Curated ultra-lightweight MinGW-w64 32-bit distribution with `gcc.exe`, `as.exe`, `ld.exe`, `ar.exe`, standard C headers, and Win32 import libraries (`kernel32`, `ws2_32`, `msvcrt`, ...).\n"
          notes += "- **Linux x64 & ARM64**: 100% statically-linked musl-GCC compiler suite and sysroot. Runs out-of-the-box on any Linux distribution (Ubuntu, Debian, Alpine, Fedora, Arch) without host glibc version dependencies.\n"
          notes += "- **macOS (Apple Silicon & Intel)**: Mach-O Clang driver and tool suite with ad-hoc codesigning to comply with macOS Gatekeeper / AMFI runtime security.\n"
          notes += "- **Zero-Setup Automation**: Automatically provisioned on-demand by the `alya` compiler into `~/.alya/toolchain/` with multi-mirror fallback and SHA-256 verification.\n\n"
          notes += "### 🔒 Verification\n"
          notes += "All archives are validated with SHA-256 checksums documented in `SHA256SUMS.txt` and `toolchain.json`.\n"

          with open('RELEASE_NOTES.md', 'w') as f:
              f.write(notes)
          PYEOF
          cat toolchain.json
          cat RELEASE_NOTES.md

      - name: Commit and Push Updated toolchain.json to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add toolchain.json
          if ! git diff --cached --quiet; then
            ver="${{ github.event.inputs.version || github.ref_name }}"
            git commit -m "chore(release): sync toolchain.json with release hashes for ${ver} [skip ci]"
            git fetch origin main
            git rebase origin/main || true
            git push origin HEAD:main
          else
            echo "toolchain.json is already up to date with repository."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version || '1.0.0')) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version || '1.0.0')) }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/alya-toolchain-windows-x64.zip
            dist/alya-toolchain-windows-arm64.zip
            dist/alya-toolchain-windows-x86.zip
            dist/alya-toolchain-linux-x64.tar.gz
            dist/alya-toolchain-linux-arm64.tar.gz
            dist/alya-toolchain-macos-arm64.tar.gz
            dist/alya-toolchain-macos-x64.tar.gz
            toolchain.json
            SHA256SUMS.txt
          draft: false
          prerelease: false
          append_body: false
          generate_release_notes: true
