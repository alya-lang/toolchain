name: Build & Release Minimal Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Toolchain release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Curate Minimal Toolchain
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?(.*)$') { $Matches[1] } else { "${{ github.event.inputs.version }}" }
          ./scripts/package.ps1 -Version $ver

      - name: Verify Toolchain Integrity & Assembly Execution
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -ToolchainPath dist/alya-toolchain-windows-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alya-toolchain-windows-x64
          path: |
            dist/alya-toolchain-windows-x64.zip
            toolchain.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/alya-toolchain-windows-x64.zip
            toolchain.json
          draft: false
          prerelease: false
          generate_release_notes: true
