name: Build & Release Multi-Platform Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Toolchain release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  schedule:
    # Run every Monday at 04:00 UTC to verify upstream updates
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Windows Minimal Toolchain
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') { $Matches[1] } else { "${{ github.event.inputs.version || '1.0.0' }}" }
          ./scripts/package.ps1 -Version $ver

      - name: Verify Windows Toolchain
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -ToolchainPath dist/alya-toolchain-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alya-toolchain-windows-x64
          path: dist/alya-toolchain-windows-x64.zip

  build-linux:
    name: Linux (x64 & ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux x64 Toolchain
        run: |
          chmod +x scripts/package-linux.sh
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-linux.sh x86_64 "$RELEASE_VER"

      - name: Verify Linux x64 Toolchain
        run: |
          mkdir -p temp_verify_x64
          tar -xzf dist/alya-toolchain-linux-x64.tar.gz -C temp_verify_x64
          ./temp_verify_x64/bin/gcc --version
          echo 'int main() { return 0; }' > test.c
          ./temp_verify_x64/bin/gcc test.c -o test_bin
          ./test_bin
          rm -rf test.c test_bin temp_verify_x64

      - name: Build Linux ARM64 Toolchain
        run: |
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-linux.sh aarch64 "$RELEASE_VER"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alya-toolchain-linux
          path: |
            dist/alya-toolchain-linux-x64.tar.gz
            dist/alya-toolchain-linux-arm64.tar.gz

  build-macos:
    name: macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS ARM64 Toolchain
        run: |
          chmod +x scripts/package-macos.sh
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-macos.sh arm64 "$RELEASE_VER"

      - name: Verify macOS ARM64 Toolchain
        run: |
          mkdir -p temp_verify_arm64
          tar -xzf dist/alya-toolchain-macos-arm64.tar.gz -C temp_verify_arm64
          ./temp_verify_arm64/bin/clang --version
          rm -rf temp_verify_arm64

      - name: Build macOS x64 Toolchain
        run: |
          RELEASE_VER="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref_name }}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              RELEASE_VER="${BASH_REMATCH[1]}"
          fi
          RELEASE_VER="${RELEASE_VER:-1.0.0}"
          ./scripts/package-macos.sh x64 "$RELEASE_VER"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alya-toolchain-macos
          path: |
            dist/alya-toolchain-macos-arm64.tar.gz
            dist/alya-toolchain-macos-x64.tar.gz

  release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory and Generate Checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Update toolchain.json Manifest with Exact Hashes
        run: |
          python3 -c "
          import json, hashlib, os

          with open('toolchain.json', 'r') as f:
              manifest = json.load(f)

          tag_or_input = '${{ github.event.inputs.version || github.ref_name }}'
          if tag_or_input.startswith('v'):
              ver = tag_or_input[1:]
          elif tag_or_input in ('main', 'master'):
              ver = '${{ github.event.inputs.version }}' or '1.0.0'
          else:
              ver = tag_or_input or '1.0.0'
          ver = ver.lstrip('v')
          manifest['version'] = ver

          file_map = {
              'x86_64-pc-windows-gnu': 'alya-toolchain-windows-x64.zip',
              'x86_64-unknown-linux-musl': 'alya-toolchain-linux-x64.tar.gz',
              'aarch64-unknown-linux-musl': 'alya-toolchain-linux-arm64.tar.gz',
              'aarch64-apple-darwin': 'alya-toolchain-macos-arm64.tar.gz',
              'x86_64-apple-darwin': 'alya-toolchain-macos-x64.tar.gz'
          }

          for platform, filename in file_map.items():
              filepath = os.path.join('dist', filename)
              if os.path.exists(filepath):
                  with open(filepath, 'rb') as af:
                      sha = hashlib.sha256(af.read()).hexdigest()
                  size_mb = round(os.path.getsize(filepath) / (1024 * 1024))
                  if platform in manifest['platforms']:
                      manifest['platforms'][platform]['archive']['sha256'] = sha
                      manifest['platforms'][platform]['archive']['compressed_size_mb'] = size_mb
                      manifest['platforms'][platform]['archive']['url'] = f'https://github.com/alya-lang/toolchain/releases/download/v{ver}/{filename}'

          with open('toolchain.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          cat toolchain.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version || '1.0.0')) }}
          files: |
            dist/alya-toolchain-windows-x64.zip
            dist/alya-toolchain-linux-x64.tar.gz
            dist/alya-toolchain-linux-arm64.tar.gz
            dist/alya-toolchain-macos-arm64.tar.gz
            dist/alya-toolchain-macos-x64.tar.gz
            toolchain.json
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
